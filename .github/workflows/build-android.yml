name: Build Saree Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saree-android-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter (Android 5+ compatible toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Generate Android project scaffold when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saree.delivery --project-name saree .
          fi

      - name: Set Android minimum SDK to 21 (Android 5.0+)
        run: |
          set -euo pipefail
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle
          if [ -f "$KTS" ]; then
            if grep -q 'minSdk = flutter.minSdkVersion' "$KTS"; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' "$KTS"
            elif ! grep -q 'minSdk = 21' "$KTS"; then
              echo "Could not locate Kotlin DSL minSdk setting" >&2
              exit 1
            fi
            grep -q 'minSdk = 21' "$KTS"
          elif [ -f "$GROOVY" ]; then
            if grep -q 'minSdkVersion flutter.minSdkVersion' "$GROOVY"; then
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$GROOVY"
            elif ! grep -q 'minSdkVersion 21' "$GROOVY"; then
              echo "Could not locate Groovy DSL minSdk setting" >&2
              exit 1
            fi
            grep -q 'minSdkVersion 21' "$GROOVY"
          else
            echo "Android Gradle app module not found" >&2
            exit 1
          fi

      - name: Apply Saree launcher icon and native splash artwork
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/values-v31"
          cat > "$RES/drawable/saree_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFB90012" android:pathData="M25,4H83C95,4 104,13 104,25V83C104,95 95,104 83,104H25C13,104 4,95 4,83V25C4,13 13,4 25,4Z"/>
              <path android:fillColor="#FFFFD45A" android:pathData="M14,37L34,37L34,42L14,42Z M10,48L31,48L31,53L10,53Z M16,59L35,59L35,64L16,64Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M59,16C43,16 31,28 31,44C31,63 59,88 59,88C59,88 87,63 87,44C87,28 75,16 59,16Z"/>
              <path android:fillColor="#FFB90012" android:pathData="M59,25A19,19 0,1 0,59 63A19,19 0,1 0,59 25Z"/>
              <path android:fillColor="#FFFFD45A" android:pathData="M43,48C45,40 51,35 59,35C67,35 73,40 75,48Z M38,50L80,50L80,55L38,55Z M43,58L75,58L72,63L46,63Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M53,30L56,30L56,35L53,35Z M59,28L62,28L62,35L59,35Z"/>
              <path android:fillColor="#FFFFD45A" android:pathData="M78,69L83,64L88,69L83,74Z"/>
          </vector>
          XML
          cat > "$RES/drawable/launch_background.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#171717" />
                  </shape>
              </item>
              <item android:drawable="@drawable/saree_launcher" android:gravity="center" />
          </layer-list>
          XML
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="سريع"/' "$MANIFEST"
          mkdir -p android/app/src/main/res/drawable-v21
          cp "$RES/drawable/launch_background.xml" android/app/src/main/res/drawable-v21/launch_background.xml
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            grep -q 'windowBackground' android/app/src/main/res/values/styles.xml || sed -i '/<style name="LaunchTheme"[^>]*>/a\        <item name="android:windowBackground">@drawable/launch_background</item>' android/app/src/main/res/values/styles.xml
          fi

      - name: Ensure Android internet and location permissions
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          for PERMISSION in android.permission.INTERNET android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION; do
            if ! grep -q "$PERMISSION" "$MANIFEST"; then
              sed -i "/<application/i\\    <uses-permission android:name=\"$PERMISSION\" />" "$MANIFEST"
            fi
            grep -q "$PERMISSION" "$MANIFEST"
          done

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://zfhqprnsrcxahzvwevse.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_nJACFgbwtYkfov-OoW76ew_BvI8ZdH6

      - name: Sign with permanent release key and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing GitHub secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/saree-release.p12"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" "$APK.aligned"
          mv "$APK.aligned" "$APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/saree-release.p12" --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --v1-signing-enabled true \
            --v2-signing-enabled true --v3-signing-enabled true "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.saree.delivery.saree'"
          printf '%s\n' "$BADGING" | grep -q "sdkVersion:'21'"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saree-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
