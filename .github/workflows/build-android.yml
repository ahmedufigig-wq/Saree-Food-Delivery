name: Build Saree Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project scaffold when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saree.delivery --project-name saree .
          fi

      - name: Configure Android minimum SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          fi

      - name: Apply Saree launcher icon and native splash artwork
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/values-v31"
          cat > "$RES/drawable/saree_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#121622" android:pathData="M54,3A51,51 0,1 0,54 105A51,51 0,1 0,54 3"/>
              <path android:fillColor="#FF8A24" android:pathData="M8,43L39,43L30,50L8,50ZM4,54L35,54L26,61L4,61Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M38,24A11,11 0,1 0,60 24A11,11 0,1 0,38 24"/>
              <path android:fillColor="#FFFF9A32" android:pathData="M36,24A13,13 0,0 1,61 24L57,20L42,20Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M42,37L60,37L70,58L53,67L35,56Z"/>
              <path android:fillColor="#FFFF8A24" android:pathData="M51,57L81,57L88,70L74,78L48,73Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M27,72A10,10 0,1 0,47 72A10,10 0,1 0,27 72M31,72A6,6 0,1 1,43 72A6,6 0,1 1,31 72"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M65,72A10,10 0,1 0,85 72A10,10 0,1 0,65 72M69,72A6,6 0,1 1,81 72A6,6 0,1 1,69 72"/>
          </vector>
          XML
          cat > "$RES/drawable/launch_background.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#20232B" />
                  </shape>
              </item>
              <item android:drawable="@drawable/saree_launcher" android:gravity="center" />
          </layer-list>
          XML
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/saree_launcher"/' "$MANIFEST"
          mkdir -p android/app/src/main/res/drawable-v21
          cp "$RES/drawable/launch_background.xml" android/app/src/main/res/drawable-v21/launch_background.xml
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            grep -q 'windowBackground' android/app/src/main/res/values/styles.xml || sed -i '/<style name="LaunchTheme"[^>]*>/a\        <item name="android:windowBackground">@drawable/launch_background</item>' android/app/src/main/res/values/styles.xml
          fi

      - name: Ensure Android internet permission
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://zfhqprnsrcxahzvwevse.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_nJACFgbwtYkfov-OoW76ew_BvI8ZdH6

      - name: Sign release APK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/saree-release.jks" -storepass android -alias saree -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Saree Food Delivery, OU=Android, O=Saree, C=YE"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/saree-release.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias saree build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saree-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
