name: Build Saree Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saree-android-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project scaffold when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saree.delivery --project-name saree .
          fi

      - name: Force Android minimum SDK 21
        run: |
          set -euo pipefail
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'GRADLE'
          
          // Explicit compatibility override for older Android devices.
          android {
              defaultConfig {
                  minSdk = 21
              }
          }
          GRADLE
            grep -q 'minSdk = 21' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle <<'GRADLE'
          
          // Explicit compatibility override for older Android devices.
          android {
              defaultConfig {
                  minSdkVersion 21
              }
          }
          GRADLE
            grep -q 'minSdkVersion 21' android/app/build.gradle
          else
            echo "Android Gradle app module not found" >&2
            exit 1
          fi

      - name: Apply Saree launcher icon and native splash artwork
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/values-v31"
          cat > "$RES/drawable/saree_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#171717" android:pathData="M54,3A51,51 0,1 0,54 105A51,51 0,1 0,54 3"/>
              <path android:fillColor="#FFE0A000" android:pathData="M7,31L39,31L28,37L7,37ZM3,42L31,42L21,48L3,48ZM9,54L34,54L24,60L9,60Z"/>
              <path android:fillColor="#FFE50914" android:pathData="M25,72A11,11 0,1 0,47 72A11,11 0,1 0,25 72M30,72A6,6 0,1 1,42 72A6,6 0,1 1,30 72"/>
              <path android:fillColor="#FFE50914" android:pathData="M64,72A11,11 0,1 0,86 72A11,11 0,1 0,64 72M69,72A6,6 0,1 1,81 72A6,6 0,1 1,69 72"/>
              <path android:fillColor="#FFFFC400" android:pathData="M36,71L48,47L66,47L78,70L72,73L62,54L51,54L42,73Z"/>
              <path android:fillColor="#FFE50914" android:pathData="M39,48L57,43L73,50L82,65L70,67L62,57L45,58L34,68L29,63Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M47,20A9,9 0,1 0,65 20A9,9 0,1 0,47 20"/>
              <path android:fillColor="#FFFFC400" android:pathData="M45,19A11,11 0,0 1,67 19L63,15L49,15Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M47,31L63,30L69,46L55,54L42,45Z"/>
              <path android:fillColor="#FFE50914" android:pathData="M47,34L62,33L69,44L58,49L46,44Z"/>
              <path android:fillColor="#FFFFC400" android:pathData="M55,50L67,49L73,56L62,59L52,57Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M37,29L46,26L52,31L44,36Z"/>
          </vector>
          XML
          cat > "$RES/drawable/launch_background.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#171717" />
                  </shape>
              </item>
              <item android:drawable="@drawable/saree_launcher" android:gravity="center" />
          </layer-list>
          XML
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="سريع"/' "$MANIFEST"
          mkdir -p android/app/src/main/res/drawable-v21
          cp "$RES/drawable/launch_background.xml" android/app/src/main/res/drawable-v21/launch_background.xml
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            grep -q 'windowBackground' android/app/src/main/res/values/styles.xml || sed -i '/<style name="LaunchTheme"[^>]*>/a\        <item name="android:windowBackground">@drawable/launch_background</item>' android/app/src/main/res/values/styles.xml
          fi

      - name: Ensure Android internet permission
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://zfhqprnsrcxahzvwevse.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_nJACFgbwtYkfov-OoW76ew_BvI8ZdH6

      - name: Sign release APK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/saree-release.jks" -storepass android -alias saree -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Saree Food Delivery, OU=Android, O=Saree, C=YE"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/saree-release.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias saree --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saree-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
