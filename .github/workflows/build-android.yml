name: Build Saree Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saree-android-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android Gradle/Lint in this toolchain calls Java 21 collection APIs.
      # Pin the JDK explicitly so the release lint task does not run on JDK 17.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter (Android 5+ compatible toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Generate Android project scaffold when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saree.delivery --project-name saree .
          fi

      - name: Ensure Android v2 embedding and Google callback activity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          match = re.search(r'namespace\\s*(?:=\\s*)?[\\'"]([^\\'"]+)[\\'"]', source)
          if not match:
              match = re.search(r'applicationId\\s*(?:=\\s*)?[\\'"]([^\\'"]+)[\\'"]', source)
          if not match:
              raise SystemExit("Could not determine Android namespace for MainActivity")
          package = match.group(1)
          activity_dir = Path("android/app/src/main/kotlin") / Path(*package.split("."))
          activity_dir.mkdir(parents=True, exist_ok=True)
          (activity_dir / "MainActivity.kt").write_text(
              f"package {package}\\n\\n"
              "import io.flutter.embedding.android.FlutterActivity\\n\\n"
              "class MainActivity : FlutterActivity()\\n"
          )

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")
          if application is None:
              raise SystemExit("AndroidManifest has no application element")
          application.set(android + "label", "سريع")
          for item in application.findall("meta-data"):
              if item.get(android + "name") == "flutterEmbedding":
                  item.set(android + "value", "2")
          else:
              ET.SubElement(application, "meta-data", {
                  android + "name": "flutterEmbedding",
                  android + "value": "2",
              })
          activity = next((node for node in application.findall("activity")
                           if node.get(android + "name", "").endswith("MainActivity")), None)
          if activity is None:
              activity = ET.SubElement(application, "activity", {
                  android + "name": ".MainActivity",
                  android + "exported": "true",
                  android + "launchMode": "singleTop",
                  android + "theme": "@style/LaunchTheme",
                  android + "configChanges": "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode",
                  android + "hardwareAccelerated": "true",
                  android + "windowSoftInputMode": "adjustResize",
              })
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.MAIN"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.LAUNCHER"})
          activity.set(android + "name", ".MainActivity")
          activity.set(android + "exported", "true")
          callback_exists = any(
              any(data.get(android + "scheme") == "com.saree.delivery" and data.get(android + "host") == "login-callback"
                  for data in intent.findall("data"))
              for intent in activity.findall("intent-filter")
          )
          if not callback_exists:
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.VIEW"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(intent, "data", {android + "scheme": "com.saree.delivery", android + "host": "login-callback"})
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
          grep -R -n 'io.flutter.app.FlutterActivity\\|io.flutter.app.FlutterApplication' android/app/src/main || true
          grep -q 'io.flutter.embedding.android.FlutterActivity' android/app/src/main/kotlin/*/*/*/MainActivity.kt || find android/app/src/main/kotlin -name MainActivity.kt -exec grep -q 'io.flutter.embedding.android.FlutterActivity' {} ;
          grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml

      - name: Set Android minimum SDK to 21 (Android 5.0+)
        run: |
          set -euo pipefail
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle
          if [ -f "$KTS" ]; then
            if grep -q 'minSdk = flutter.minSdkVersion' "$KTS"; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' "$KTS"
            elif ! grep -q 'minSdk = 21' "$KTS"; then
              echo "Could not locate Kotlin DSL minSdk setting" >&2
              exit 1
            fi
            grep -n 'minSdk' "$KTS"
            grep -q 'minSdk = 21' "$KTS"
          elif [ -f "$GROOVY" ]; then
            if grep -q 'minSdkVersion flutter.minSdkVersion' "$GROOVY"; then
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "$GROOVY"
            elif ! grep -q 'minSdkVersion 21' "$GROOVY"; then
              echo "Could not locate Groovy DSL minSdk setting" >&2
              exit 1
            fi
            grep -n 'minSdk' "$GROOVY"
            grep -q 'minSdkVersion 21' "$GROOVY"
          else
            echo "Android Gradle app module not found" >&2
            exit 1
          fi

      - name: Configure Android SDK and ML Kit shrinker rules
        run: |
          set -euo pipefail
          KTS=android/app/build.gradle.kts
          GROOVY=android/app/build.gradle
          if [ -f "$KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$KTS"
            grep -q 'compileSdk = 36' "$KTS" || sed -i '/android {/a\    compileSdk = 36' "$KTS"
            if grep -q 'ndkVersion = flutter.ndkVersion' "$KTS"; then
              sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' "$KTS"
            elif ! grep -q 'ndkVersion = "27.0.12077973"' "$KTS"; then
              sed -i '/android {/a\    ndkVersion = "27.0.12077973"' "$KTS"
            fi
          elif [ -f "$GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GROOVY"
            if grep -q 'ndkVersion flutter.ndkVersion' "$GROOVY"; then
              sed -i "s/ndkVersion flutter.ndkVersion/ndkVersion '27.0.12077973'/" "$GROOVY"
            elif ! grep -q "ndkVersion '27.0.12077973'" "$GROOVY"; then
              sed -i "/android {/a\    ndkVersion '27.0.12077973'" "$GROOVY"
            fi
          else
            echo "Android Gradle app module not found" >&2
            exit 1
          fi
          cat > android/app/proguard-rules.pro <<'RULES'
          # Optional ML Kit text recognizer script implementations are not bundled.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          RULES
          test -s android/app/proguard-rules.pro
          # Attach compatibility rules to the release shrinker.
          if [ -f "$KTS" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "proguardFiles(" not in s:
              m = re.search(r"buildTypes\s*\{\s*release\s*\{", s)
              if not m:
                  raise SystemExit("Could not locate release buildType in Kotlin Gradle file")
              addition = '\n            isMinifyEnabled = true\n            isShrinkResources = false\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")\n'
              s = s[:m.end()] + addition + s[m.end():]
              p.write_text(s)
          PY
          elif [ -f "$GROOVY" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "proguardFiles" not in s:
              m = re.search(r"buildTypes\s*\{\s*release\s*\{", s)
              if not m:
                  raise SystemExit("Could not locate release buildType in Groovy Gradle file")
              addition = '\n            minifyEnabled true\n            shrinkResources false\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"\n'
              s = s[:m.end()] + addition + s[m.end():]
              p.write_text(s)
          PY
          fi
          grep -nE 'proguardFiles|isMinifyEnabled|minifyEnabled|compileSdk|ndkVersion' android/app/build.gradle*

      - name: Apply Saree launcher icon and native splash artwork
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          mkdir -p "$RES/drawable" "$RES/values-v31"
          cat > "$RES/drawable/saree_launcher.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFB90012" android:pathData="M25,4H83C95,4 104,13 104,25V83C104,95 95,104 83,104H25C13,104 4,95 4,83V25C4,13 13,4 25,4Z"/>
              <path android:fillColor="#FFFFD45A" android:pathData="M14,37L34,37L34,42L14,42Z M10,48L31,48L31,53L10,53Z M16,59L35,59L35,64L16,64Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M59,16C43,16 31,28 31,44C31,63 59,88 59,88C59,88 87,63 87,44C87,28 75,16 59,16Z"/>
              <path android:fillColor="#FFB90012" android:pathData="M59,25A19,19 0,1 0,59 63A19,19 0,1 0,59 25Z"/>
              <path android:fillColor="#FFFFD45A" android:pathData="M43,48C45,40 51,35 59,35C67,35 73,40 75,48Z M38,50L80,50L80,55L38,55Z M43,58L75,58L72,63L46,63Z"/>
              <path android:fillColor="#FFFFFFFF" android:pathData="M53,30L56,30L56,35L53,35Z M59,28L62,28L62,35L59,35Z"/>
              <path android:fillColor="#FFFFD45A" android:pathData="M78,69L83,64L88,69L83,74Z"/>
          </vector>
          XML
          cat > "$RES/drawable/launch_background.xml" <<'XML'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#171717" />
                  </shape>
              </item>
              <item android:drawable="@drawable/saree_launcher" android:gravity="center" />
          </layer-list>
          XML
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/saree_launcher"/' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="سريع"/' "$MANIFEST"
          mkdir -p android/app/src/main/res/drawable-v21
          cp "$RES/drawable/launch_background.xml" android/app/src/main/res/drawable-v21/launch_background.xml
          if [ -f android/app/src/main/res/values/styles.xml ]; then
            grep -q 'windowBackground' android/app/src/main/res/values/styles.xml || sed -i '/<style name="LaunchTheme"[^>]*>/a\        <item name="android:windowBackground">@drawable/launch_background</item>' android/app/src/main/res/values/styles.xml
          fi

      - name: Ensure Android internet permission
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          if ! grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          fi
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST"
          # Supabase Google OAuth callback deep link.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          activity = next((node for node in root.iter("activity") if node.get(android + "name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("MainActivity was not found in AndroidManifest.xml")
          for node in activity.findall("intent-filter"):
              data = node.find("data")
              if data is not None and data.get(android + "scheme") == "com.saree.delivery" and data.get(android + "host") == "login-callback":
                  break
          else:
              intent = ET.SubElement(activity, "intent-filter")
              ET.SubElement(intent, "action", {android + "name": "android.intent.action.VIEW"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.DEFAULT"})
              ET.SubElement(intent, "category", {android + "name": "android.intent.category.BROWSABLE"})
              ET.SubElement(intent, "data", {android + "scheme": "com.saree.delivery", android + "host": "login-callback"})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          grep -q 'com.saree.delivery' "$MANIFEST"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://zfhqprnsrcxahzvwevse.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_nJACFgbwtYkfov-OoW76ew_BvI8ZdH6

      - name: Sign release APK with persistent upload key
        env:
          SAREE_KEYSTORE_BASE64: ${{ secrets.SAREE_KEYSTORE_BASE64 }}
          SAREE_KEYSTORE_PASSWORD: ${{ secrets.SAREE_KEYSTORE_PASSWORD }}
          SAREE_KEY_ALIAS: ${{ secrets.SAREE_KEY_ALIAS }}
          SAREE_KEY_PASSWORD: ${{ secrets.SAREE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SAREE_KEYSTORE_BASE64:?Missing GitHub Actions secret SAREE_KEYSTORE_BASE64}"
          : "${SAREE_KEYSTORE_PASSWORD:?Missing GitHub Actions secret SAREE_KEYSTORE_PASSWORD}"
          : "${SAREE_KEY_ALIAS:?Missing GitHub Actions secret SAREE_KEY_ALIAS}"
          : "${SAREE_KEY_PASSWORD:?Missing GitHub Actions secret SAREE_KEY_PASSWORD}"
          KEYSTORE_PATH="$RUNNER_TEMP/saree-upload-key.p12"
          PEM_PATH="$RUNNER_TEMP/saree-signing-material.pem"
          NORMALIZED_KEYSTORE="$RUNNER_TEMP/saree-upload-normalized.p12"
          printf '%s' "$SAREE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          # Java 21's PKCS12 provider rejects non-ASCII passwords. Normalize the
          # existing PKCS12 key with OpenSSL, then sign using a temporary ASCII
          # password. This preserves the original private key/certificate.
          openssl pkcs12 -in "$KEYSTORE_PATH" -nodes \
            -passin env:SAREE_KEYSTORE_PASSWORD -out "$PEM_PATH"
          test -s "$PEM_PATH"
          SAREE_NORMALIZED_PASSWORD="$(openssl rand -hex 24)"
          export SAREE_NORMALIZED_PASSWORD
          openssl pkcs12 -export -in "$PEM_PATH" -out "$NORMALIZED_KEYSTORE" \
            -name "$SAREE_KEY_ALIAS" -passout env:SAREE_NORMALIZED_PASSWORD
          chmod 600 "$NORMALIZED_KEYSTORE"
          test -s "$NORMALIZED_KEYSTORE"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$NORMALIZED_KEYSTORE" --ks-type PKCS12 \
            --ks-pass env:SAREE_NORMALIZED_PASSWORD --key-pass env:SAREE_NORMALIZED_PASSWORD \
            --ks-key-alias "$SAREE_KEY_ALIAS" --v1-signing-enabled true \
            --v2-signing-enabled true --v3-signing-enabled true \
            build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 build/app/outputs/flutter-apk/app-release.apk
          BADGING="$("$BUILD_TOOLS/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\\n' "$BADGING" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          printf '%s\\n' "$BADGING" | grep -q "^sdkVersion:'21'$" || {
            echo "APK minimum SDK is not 21; refusing to publish an incompatible package." >&2
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saree-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
