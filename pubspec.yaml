name: saree
description: Food delivery platform for Rada'a, Yemen
publish_to: 'none'
version: 1.2.12+30
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  supabase_flutter: ^2.8.4
  geolocator: ^13.0.4
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  image_picker: 1.1.2
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_face_detection: ^0.14.0
  pdf: ^3.11.3
  printing: ^5.14.2

dependency_overrides:
  # Keep the image picker Android implementation compatible with Flutter 3.32 / API 21.
  image_picker_android: 0.8.12+22
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: SareeArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
