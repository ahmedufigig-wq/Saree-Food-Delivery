name: saree
description: Food delivery platform for Rada'a, Yemen
publish_to: 'none'
version: 1.1.4+8
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  supabase_flutter: ^2.8.4
  geolocator: ^13.0.4
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  image_picker: 1.1.2

dependency_overrides:
  # Keep the image picker Android implementation compatible with Flutter 3.32 / API 21.
  image_picker_android: 0.8.12+22
flutter:
  uses-material-design: true

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
